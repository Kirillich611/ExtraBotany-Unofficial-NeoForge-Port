plugins {
    id 'com.diffplug.spotless' version '7.0.4' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'
    apply plugin: 'pmd'
    apply plugin: "com.diffplug.spotless"
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    java.withSourcesJar()

    repositories {
        // Optional local Maven mirror for machines whose Java HTTPS downloads fail.
        def portCache = rootProject.file('.codex-backup/maven')
        if (portCache.isDirectory()) {
            maven {
                name = 'LocalPortCache'
                url = portCache.toURI()
                metadataSources { gradleMetadata(); mavenPom(); artifact(); ignoreGradleMetadataRedirection() }
            }
        }
        mavenCentral()

        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 21
        it.options.compilerArgs += ['-Xmaxerrs', '1000']
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        it.enabled = false
    }

    pmd {
        toolVersion = '7.15.0'
        incrementalAnalysis.set(true)
        ruleSetFiles = rootProject.files("spotless/pmd-ruleset.xml")
    }

    // PMD only needs compile APIs, including optional integrations, for type analysis.
    tasks.withType(Pmd).configureEach {
        if (name == 'pmdMain') {
            classpath = sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }

    jar {
        //from "LICENSE"

        exclude "**/*.bat"
        exclude "**/*.psd"
        exclude "**/*.ase"
        exclude "**/*.exe"
        exclude "**/unused"

        exclude ".cache"
    }

    spotless {
        enforceCheck = false // workaround around jenkins having wrong line endings in some files
        // we explicitly check in github actions builds
        java {
            indentWithTabs()
            eclipse().configFile rootProject.file('spotless/eclipseformat.xml')
            removeUnusedImports()
            importOrderFile rootProject.file('spotless/eclipse.importorder')
        }
    }
    /*
    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
    //*/
}
// Do not query the EventWrapper server for unrelated dependencies.
subprojects {
    repositories.configureEach {
        if (url.toString().startsWith('https://maven.lounode.top/')) {
            content { includeGroup 'io.github.lounode.eventwrapper' }
        }
    }
}
